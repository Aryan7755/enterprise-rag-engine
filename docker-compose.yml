

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rag-engine-backend
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - PINECONE_API_KEY=${PINECONE_API_KEY:-}
      - PINECONE_INDEX_NAME=${PINECONE_INDEX_NAME:-enterprise-knowledge-base}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rag-engine-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped